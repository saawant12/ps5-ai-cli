[package]
license = "GPL-3.0-or-later"
name = "ps5-rust-runtime-probe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib"]

[dependencies]
# Match Codex's libc ABI definitions while testing its runtime dependencies.
libc = "=0.2.186"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "net", "time", "io-util", "signal"] }

[profile.release]
panic = "abort"
opt-level = 2
